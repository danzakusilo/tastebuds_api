suite: service
templates:
  - templates/service.yaml
values:
  - ../ci/ci-values.yaml
tests:
  - it: exposes only the api pods on port 80
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports
          value:
            - name: http
              port: 80
              targetPort: http
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: tastebuds-core
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/component: api
