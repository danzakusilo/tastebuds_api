{{- $environment := required "environment is required" .Values.environment }}
{{- $dbUrl := required "database.url is required" .Values.database.url }}
{{- $migratorSecret := required "database.migratorSecret is required" .Values.database.migratorSecret }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "tastebuds-core.fullname" . }}-migrate
  labels:
    {{- include "tastebuds-core.labels" (dict "ctx" . "component" "migrate") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "tastebuds-core.labels" (dict "ctx" . "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- include "tastebuds-core.podSecurityContext" . | nindent 6 }}
      containers:
        - name: migrate
          image: {{ include "tastebuds-core.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          env:
            - name: TASTEBUDS_ENV
              value: {{ $environment | quote }}
            - name: DATABASE_URL
              value: {{ $dbUrl | quote }}
            - name: FLYWAY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $migratorSecret | quote }}
                  key: username
            - name: FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $migratorSecret | quote }}
                  key: password
            - name: SPRING_FLYWAY_CONNECT_RETRIES
              value: {{ .Values.migration.connectRetries | quote }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          securityContext:
            {{- include "tastebuds-core.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
