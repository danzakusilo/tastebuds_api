apiVersion: v1
kind: Service
metadata:
  name: {{ include "tastebuds-core.fullname" . }}-api
  labels:
    {{- include "tastebuds-core.labels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "tastebuds-core.selectorLabels" (dict "ctx" . "component" "api") | nindent 4 }}
