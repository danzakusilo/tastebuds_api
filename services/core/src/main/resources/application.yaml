spring:
  application:
    name: tastebuds-core
  threads:
    virtual:
      enabled: true
  datasource:
    # No defaults for credentials: production values come from secrets, local dev uses Testcontainers (bootTestRun).
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tastebuds}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      connection-timeout: 5000 # ms
      data-source-properties:
        # `core` first so unqualified tables resolve to the app schema; `public` for extension types/operators (pgvector).
        currentSchema: core,public
        # Hard cap on any single statement: a slow query must not exhaust the pool.
        options: "-c statement_timeout=5000"
  flyway:
    schemas: core
    default-schema: core
    # Own connection, not the app pool: no statement_timeout (migrations may legitimately run long) and the
    # schema-owning role (`migrator` in production, docs/PLAN.md §8.4). Falls back to the app credentials, which
    # only works when the app user owns the schema (V2 revokes `app_rw` access to flyway_schema_history).
    # In Kubernetes the api and worker pods set SPRING_FLYWAY_ENABLED=false; the `migrate` command applies migrations
    # as a separate Job before new pods start (docs/deploy/DATABASE.md).
    user: ${FLYWAY_USERNAME:${spring.datasource.username}}
    password: ${FLYWAY_PASSWORD:${spring.datasource.password}}
  data:
    redis:
      # Rate-limit buckets (platform.ratelimit). The Helm chart sets REDIS_HOST; credentials, if any, via
      # SPRING_DATA_REDIS_USERNAME / SPRING_DATA_REDIS_PASSWORD. Local dev: Testcontainers (bootTestRun).
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mvc:
    problemdetails:
      enabled: false # handled by ProblemDetailsAdvice

server:
  port: 8080
  shutdown: graceful
  max-http-request-header-size: 16KB
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
  # Behind a TLS-terminating ingress. X-Forwarded-For/-Proto are honoured only from internal proxies, see
  # docs/security/FORWARDED_HEADERS.md. SERVER_TOMCAT_REMOTEIP_INTERNALPROXIES replaces Boot's default trusted range
  # (comma-separated CIDR list, e.g. 10.1.0.0/16). A CIDR list can make Tomcat resolve host names from X-Forwarded-For.
  # No range holds only the ingress pods: limit who can connect to the api pods with a NetworkPolicy instead.
  forward-headers-strategy: native
  tomcat:
    connection-timeout: 10s
    max-swallow-size: 2MB
    max-http-form-post-size: 1MB
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto

management:
  # Actuator on its own port: never routed through the public ingress.
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    build:
      enabled: true
  tracing:
    sampling:
      # Sample everything in the app; the OTel Collector does tail-based sampling (keeps errors and slow traces).
      probability: 1.0
  opentelemetry:
    resource-attributes:
      service.namespace: tastebuds
      deployment.environment: ${TASTEBUDS_ENV:local}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 30s

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        environment: ${TASTEBUDS_ENV:local}

tastebuds:
  role: ${TASTEBUDS_ROLE:all}
  cors:
    allowed-origins: []
  web:
    max-request-body-size: 1MB # applies to every request body; bigger uploads get their own route-level limit later
  anon-session:
    # Signed bearer tokens for signed-out users, docs/security/ANON_SESSIONS.md. Signing keys come from a secret, never
    # from this file: TASTEBUDS_ANONSESSION_SIGNINGKEYS_0_ID / TASTEBUDS_ANONSESSION_SIGNINGKEYS_0_SECRET (Base64,
    # at least 32 bytes; index 0 signs, every listed key verifies). Required in the api role.
    ttl: 30d                      # absolute lifetime from creation; no renewal
    ephemeral-signing-key: false  # true only for local development and tests: a random key per start
  # Changing capacity, refill-tokens or refill-period (top level or under session) changes the Redis key prefix of
  # those buckets: every client, an attacker too, gets a new full bucket, and during a rolling deploy old and new pods
  # count in separate buckets.
  rate-limit:
    # Per-client token buckets in Redis, docs/PLAN.md §8.2. Fails open while Redis is unavailable.
    enabled: true
    capacity: 120          # burst size in tokens
    refill-tokens: 120     # tokens added back per refill period (greedy)
    refill-period: 1m
    default-cost: 1        # tokens per /v1 request without a matching rule
    timeout: 250ms         # Redis connect/command timeout; slower means fail open
    reconnect-backoff: 5s  # pause between connect attempts while Redis is down
    session:                 # bucket per anonymous session, checked before the IP bucket; both must allow
      capacity: 120
      refill-tokens: 120
      refill-period: 1m
    rules:                 # first match wins; method optional (absent = any method)
      - method: GET
        pattern: /v1/meta
        cost: 1
      - method: POST
        pattern: /v1/sessions/anonymous
        cost: 10
  observability:
    wide-events:
      exclude-paths:
        - /actuator/**
