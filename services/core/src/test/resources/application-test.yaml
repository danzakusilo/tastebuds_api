# Tests never ship telemetry anywhere; wide events are asserted from the console output instead.
management:
  tracing:
    export:
      enabled: false
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
  server:
    port: 0
tastebuds:
  rate-limit:
    # Off unless a test turns it on and imports RedisTestcontainersConfiguration: other contexts have no Redis.
    enabled: false
